name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: turquaz
          POSTGRES_PASSWORD: turquaz
          POSTGRES_DB: turquaz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turquaz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TURQUAZ_DB_URL: jdbc:postgresql://localhost:5432/turquaz
      TURQUAZ_DB_USER: turquaz
      TURQUAZ_DB_PASSWORD: turquaz

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & test
        run: mvn --batch-mode --no-transfer-progress verify
