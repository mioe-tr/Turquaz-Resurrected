server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Statik varlık cache'i
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # REST API → api container
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /auth/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # OpenAPI / Swagger geçişi
    location /swagger-ui.html { proxy_pass http://api:8080; }
    location /swagger-ui/ { proxy_pass http://api:8080; }
    location /v3/api-docs { proxy_pass http://api:8080; }
    location /v3/api-docs/ { proxy_pass http://api:8080; }

    # SPA fallback: bilinmeyen route'ları index.html'e döndür
    location / {
        try_files $uri $uri/ /index.html;
    }
}
