spring:
  application:
    name: turquaz-api
  datasource:
    url: ${TURQUAZ_DB_URL:jdbc:postgresql://localhost:5432/turquaz}
    username: ${TURQUAZ_DB_USER:turquaz}
    password: ${TURQUAZ_DB_PASSWORD:turquaz}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html

turquaz:
  security:
    # HS256 için kullanılan paylaşılan sır. ÜRETİMDE değişkenlerden alın; min 32 byte.
    jwt-secret: ${TURQUAZ_JWT_SECRET:dev-only-secret-please-change-me-32+bytes-required}
    jwt-ttl: ${TURQUAZ_JWT_TTL:PT8H}
